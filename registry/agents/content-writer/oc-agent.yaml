runtime: toc-native
name: content-writer
description: Writing assistant — improves drafts, matches your voice, works across formats
model: anthropic/claude-opus-4.6
context:
  - BOOTSTRAP.md
  - voice.md
  - writing/
skills:
  - transcribe-video
  - import-instagram
  - import-tiktok
  - import-twitter
  - import-linkedin
compose:
  - BOOTSTRAP.md
  - voice.md
permissions:
  filesystem:
    read: "on"
    write: "on"
    execute: "off"
  network:
    web: "on"
  integrations:
    apify:
      - "run_actor:*"
