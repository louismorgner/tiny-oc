runtime: toc-native
name: content-writer
description: Writing assistant — improves drafts, matches your voice, works across formats
model: anthropic/claude-opus-4.6
context:
  - BOOTSTRAP.md
  - voice.md
  - writing/
compose:
  - BOOTSTRAP.md
  - voice.md
behaviors:
  - name: voice-review
    on: turn_complete
    when:
      file_written: "writing/*.md"
    prompt: |
      You just saved a new piece to writing/. Before moving on:
      1. Re-read voice.md.
      2. Does the piece match the user's voice? Be specific about what matches and what doesn't.
      3. If it doesn't match, revise the piece now.
      4. Update voice.md if you learned any new patterns about how the user writes.
permissions:
  filesystem:
    read: "on"
    write: "on"
    execute: "off"
  network:
    web: "on"
